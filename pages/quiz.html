                <text x="80" y="152" text-anchor="middle" style="font:600 8px var(--font-mono);letter-spacing:.12em;fill:rgb(var(--c-brand))">8,848M ALT</text>
              </svg>
            </div>
          </div>

          <h2 class="h aurora" style="font-size:1.5rem">Your personalised quiz is being made…</h2>
          <p class="muted">${esc(subtitle)}</p>
          <div class="bar" style="width:min(100%,22rem)"><i id="qp" style="width:0"></i></div>
          <p class="qstat" id="qstat">Reading the lesson…</p>
        </div>`);

      // fake progress: 28 ticks x 100ms ≈ 2.8s, then run `after`
      const steps = ['Reading the lesson…', 'Choosing questions that fit you…', 'Mixing up the answers…', 'Almost ready…'];
      let t = 0;
      clearInterval(qs.timer);
      qs.timer = setInterval(() => {
        const bar = $('#qp');
        if (!bar) { clearInterval(qs.timer); return; }

        t++;
        const pct = Math.min(100, t * 100 / 28);
        bar.style.width = pct + '%';
        $('#qstat').textContent = steps[Math.min(3, Math.floor(pct / 26))];

        if (t >= 28) { clearInterval(qs.timer); after(); }
      }, 100);
    }

    // start a normal quiz (weak = null) or a weak-points practice round
    function qStart(weak) {
      qs.practice = !!weak;
      if (!weak) qs.seen = new Set();

      const subtitle = weak
        ? 'Targeting your weak points: ' + weak.join(', ')
        : DIFF[qs.diff][0] + ' · ' + qs.n + ' questions · ' + L[qs.i].t;

      qLoad(subtitle, () => {
        qs.list = pickQuiz(qs.i, qs.diff, qs.n, weak, qs.seen);
        qs.list.forEach(q => qs.seen.add(q.q));
        qs.k = 0;
        qs.ans = [];
        qs.t0 = Date.now();
        qs.xp = 0;
        qQuestion();
      });
    }

    /* ==========================================================
       11. SCREEN 3 · QUESTION
       ========================================================== */
    function qQuestion() {
      const q = qs.list[qs.k];
      const total = qs.list.length;

      qRender(`
        <div class="qtop">
          <span class="badge badge-brand">${qs.practice ? 'Weak-points practice' : DIFF[qs.diff][0]}</span>
          <span class="badge">${esc(q.t)}</span>
          <span class="qcount">Question ${qs.k + 1} of ${total}</span>
        </div>
        <div class="bar"><i style="width:${qs.k / total * 100}%"></i></div>

        <div class="sec quiz">
          <h3>Question ${qs.k + 1}</h3>
          <p style="margin-bottom:.8rem;color:rgb(var(--c-text))"><b>${esc(q.q)}</b></p>
          <div class="qopts">
            ${q.o.map((o, k) => `<button class="qopt" data-k="${k}" type="button">${esc(o)}</button>`).join('')}
          </div>
          <p class="qfb" id="qfb"></p>
        </div>

        <div class="qact" id="qnx" hidden>
          <button class="btn btn-primary shine btn-lg" id="qnext2" type="button">
            ${qs.k + 1 < total ? 'Next question' : 'See my results'}<span class="icon">arrow_forward</span>
          </button>
        </div>`);
    }

    /* ==========================================================
       12. SCREEN 4 · RESULTS
       ========================================================== */
    function qResults() {
      const list = qs.list;
      const i = qs.i;
      const ok = list.filter((q, j) => qs.ans[j] === q.c).length;
      const pct = Math.round(ok / list.length * 100);
      const pass = pct >= 60;

      // elapsed time m:ss
      const secs = Math.max(1, Math.round((Date.now() - (qs.t0 || Date.now())) / 1000));
      const time = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');

      // score per topic -> strong (>=67%) / weak
      const topics = {};
      list.forEach((q, j) => {
        const a = topics[q.t] = topics[q.t] || [0, 0];
        a[1]++;
        if (qs.ans[j] === q.c) a[0]++;
      });
      const rows = Object.entries(topics)
        .map(([t, a]) => ({ t, a: a[0], b: a[1], p: Math.round(a[0] / a[1] * 100) }))
        .sort((x, y) => x.p - y.p);
      const strong = rows.filter(r => r.p >= 67);
      const weak   = rows.filter(r => r.p < 67);
      qs.weak = weak.map(r => r.t);

      // save grade / XP / completion (not for practice rounds)
      const xpBefore = xpNow();
      if (!qs.practice) {
        const prior = grades[i] ?? 0;
        grades[i] = Math.max(prior, pct);
        if (pass && !done.has(i)) addXp(40);
        if (pct === 100 && prior < 100) addXp(10);
        store.set('ce-grades', JSON.stringify(grades));

        if (pass) {
          done.add(i);
          store.set('ce-done', JSON.stringify([...done]));
          if (done.size === L.length && !store.get('ce-cert')) store.set('ce-celebrate', '1');
        }
      }
      const bonus = xpNow() - xpBefore;
      const earned = (qs.xp || 0) + bonus;
      if (bonus > 0) toast('Lesson bonus +' + bonus + ' XP', 'bolt');

      touchDay();
      renderSide();
      if (pct === 100) confetti(90);

      // copy
      const msg = pct >= 90 ? 'Outstanding!' : pct >= 75 ? 'Great job!' : pct >= 60 ? 'Nice work!' : 'Keep climbing!';
      const note = qs.practice
        ? 'Practice round: your grade stays the same.'
        : pass
          ? 'Passed — this lesson is checked off ✓'
          : 'You need 60% to check this lesson off. You can try again.';

      const stat = r => r.p >= 67 ? ['Strong', 'ok'] : r.p >= 34 ? ['Developing', 'mid'] : ['Needs work', 'bad'];

      const chips = (arr, cls, icon) => arr.map(r =>
        `<span class="tchip ${cls}"><span class="icon">${icon}</span>${esc(r.t)}<em>${r.p}%</em></span>`
      ).join('');

      const strongNames = strong.slice(0, 3).map(r => `<b class="tg">${esc(r.t)}</b>`).join(', ');
      const weakNames   = weak.slice(0, 3).map(r => `<b class="tw">${esc(r.t)}</b>`).join(', ');
      const verb = weak.length > 1 ? 'need' : 'needs';

      const sub = weak.length
        ? (strong.length
            ? `Nice, you're solid on ${strongNames}. But ${weakNames} still ${verb} work. Pick your next move:`
            : `${weakNames} ${verb} the most work right now. Pick your next move:`)
        : `You nailed every topic: ${strongNames}. Pick your next move:`;

      const nextTitle = i < L.length - 1 ? 'Next up: ' + esc(L[i + 1].t) : 'You reached the last lesson';

      // answer choices list for the review section
      const choices = (q, j) => q.o.map((o, k) => {
        const mine = qs.ans[j] === k;
        const right = k === q.c;
        return `<li class="ch ${right ? 'right' : ''} ${mine && !right ? 'wrong' : ''}">
          <span class="mk">${right ? '✓' : mine ? '✗' : ''}</span>
          <span>${esc(o)}</span>
          ${mine ? '<em>Your answer</em>' : right ? '<em>Correct answer</em>' : ''}
        </li>`;
      }).join('');

      qRender(
        backBtn() +

        // --- hero: score ring + chips ---
        `<section class="rhero">
          <div class="rring"><div class="rin"><b id="rnum">0</b><span>%</span></div></div>
          <div class="rtxt">
            <span class="eyebrow">${qs.practice ? 'Practice results' : 'Quiz results'} · ${esc(L[i].t)}</span>
            <h1 class="h aurora">${msg}</h1>
            <p class="muted">${note}</p>
            <div class="rchips">
              <span class="rchip"><span class="icon">check_circle</span>${ok}/${list.length} correct</span>
              <span class="rchip"><span class="icon">timer</span>${time}</span>
              <span class="rchip yel"><span class="icon">bolt</span>+${earned} XP</span>
              <span class="rchip"><span class="icon">${DIFF[qs.diff][1]}</span>${qs.practice ? 'Practice' : DIFF[qs.diff][0]}</span>
            </div>
          </div>
          ${peaks}
        </section>

        <!-- question map -->
        <div class="qmap" title="Jump to a question">
          ${list.map((q, j) => `<button class="qdot ${qs.ans[j] === q.c ? 'good' : 'bad'}" data-rv="${j}" type="button">${j + 1}</button>`).join('')}
        </div>

        <!-- strengths / needs practice -->
        <div class="cols">
          <section class="card good">
            <h3><span class="icon" style="color:rgb(var(--c-ok))">emoji_events</span>Strengths</h3>
            <div class="tchips">${strong.length ? chips(strong, '', 'check') : '<p class="muted small">No strong topics yet. Keep practising!</p>'}</div>
          </section>
          <section class="card weak">
            <h3><span class="icon" style="color:#f59e0b">flag</span>Needs practice</h3>
            <div class="tchips">${weak.length ? chips(weak, 'bad', 'priority_high') : '<p class="muted small">Nothing to fix. Nice work!</p>'}</div>
          </section>
        </div>

        <!-- skill breakdown -->
        <section class="card">
          <h3><span class="icon" style="color:rgb(var(--c-brand))">insights</span>Skill breakdown</h3>
          ${rows.map(r => {
            const s = stat(r);
            return `<div class="sk">
              <div class="sname"><b>${esc(r.t)}</b><span class="stag ${s[1]}">${s[0]}</span></div>
              <div class="rb"><i class="${s[1]}" data-w="${r.p}"></i></div>
              <span class="spct">${r.a}/${r.b} · ${r.p}%</span>
            </div>`;
          }).join('')}
        </section>

        <!-- answer review -->
        <section class="card">
          <div class="rhead">
            <h3><span class="icon" style="color:rgb(var(--c-brand))">fact_check</span>Review your answers</h3>
            <button class="btn btn-secondary" id="chall" type="button"><span class="icon">visibility</span>Show all choices</button>
          </div>
          ${list.map((q, j) => {
            const good = qs.ans[j] === q.c;
            return `<details class="rq ${good ? 'good' : 'bad'}" id="rv${j}">
              <summary>
                <span class="rn">${j + 1}</span>
                <span class="rt">${esc(q.q)}</span>
                <span class="icon">${good ? 'check_circle' : 'cancel'}</span>
              </summary>
              <div class="rbody">
                <button class="btn btn-secondary" data-ch="${j}" type="button"><span class="icon">visibility</span>Show choices</button>
                <ul class="choices" id="ch${j}" hidden>${choices(q, j)}</ul>
                <p class="muted">${esc(q.x)}</p>
                <span class="tchip ${good ? '' : 'bad'}">${esc(q.t)}</span>
              </div>
            </details>`;
          }).join('')}
        </section>

        <!-- what next -->
        <section class="nxt">
          <div class="nxt-h">
            <span class="icon nxt-ic">explore</span>
            <div><h3>What's your next move?</h3><p class="nxt-sub">${sub}</p></div>
          </div>
          <div class="ncards">
            ${weak.length ? `
              <button class="ncard hot" id="qweak" type="button">
                <span class="icon nc-ic">target</span>
                <div class="nc-t">
                  <b>Retake on my weak points</b>
                  <small>A quiz built only from ${weak.length === 1 ? 'this topic' : 'these topics'}</small>
                  <span class="tchips">${chips(weak.slice(0, 3), 'bad', 'priority_high')}</span>
                </div>
                <span class="icon nc-go">arrow_forward</span>
              </button>` : ''}

            <a class="ncard" href="${dash(Math.min(i + 1, L.length - 1))}">
              <span class="icon nc-ic">arrow_circle_right</span>
              <div class="nc-t"><b>Continue to next lesson</b><small>${nextTitle}</small></div>
              <span class="icon nc-go">arrow_forward</span>
            </a>

            <button class="ncard" id="qnew" type="button">
              <span class="icon nc-ic">tune</span>
              <div class="nc-t"><b>New quiz</b><small>Change the difficulty or the number of questions</small></div>
              <span class="icon nc-go">arrow_forward</span>
            </button>
          </div>
        </section>`
      );

      // animate score ring + counter (900ms, ease-out cubic)
      const ring = $('#app .rring');
      const num = $('#rnum');
      const start = performance.now();
      (function frame(t) {
        if (!ring.isConnected) return;
        const k = Math.min(1, (t - start) / 900);
        const v = Math.round(pct * (1 - Math.pow(1 - k, 3)));
        ring.style.setProperty('--p', v);
        num.textContent = v;
        if (k < 1) requestAnimationFrame(frame);
      })(start);

      // animate skill bars
      setTimeout(() => $$('#app .rb i').forEach(e => e.style.width = e.dataset.w + '%'), 60);
    }

    /* ==========================================================
       13. QUIZ EVENT HANDLING (one delegated listener)
       ========================================================== */
    $('#app').addEventListener('click', e => {
      const t = e.target;

      // "Show choices" for a single reviewed question
      const choiceBtn = t.closest('[data-ch]');
      if (choiceBtn) {
        const list = $('#ch' + choiceBtn.dataset.ch);
        const show = list.hidden;
        list.hidden = !show;
        choiceBtn.lastChild.textContent = show ? 'Hide choices' : 'Show choices';
        choiceBtn.querySelector('.icon').textContent = show ? 'visibility_off' : 'visibility';
        return;
      }

      // "Show all choices" toggle
      if (t.closest('#chall')) {
        const btn = t.closest('#chall');
        const show = btn.dataset.on !== '1';
        btn.dataset.on = show ? '1' : '0';

        $$('#app .choices').forEach(l => l.hidden = !show);
        $$('#app .rq').forEach(d => { if (show) d.open = true; });
        $$('#app [data-ch]').forEach(x => {
          x.lastChild.textContent = show ? 'Hide choices' : 'Show choices';
          x.querySelector('.icon').textContent = show ? 'visibility_off' : 'visibility';
        });

        btn.lastChild.textContent = show ? 'Hide all choices' : 'Show all choices';
        btn.querySelector('.icon').textContent = show ? 'visibility_off' : 'visibility';
        return;
      }

      // jump to a question from the dot map
      const dot = t.closest('[data-rv]');
      if (dot) {
        const details = $('#rv' + dot.dataset.rv);
        if (details) {
          details.open = true;
          details.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        return;
      }

      // navigation buttons
      if (t.closest('#qnew'))   return qSetup();
      if (t.closest('#qweak'))  return qStart(qs.weak);
      if (t.closest('#qstart')) return qStart(null);

      if (t.closest('#qnext2')) {
        if (qs.k + 1 < qs.list.length) { qs.k++; qQuestion(); }
        else qResults();
        return;
      }

      if (t.closest('#qminus')) return setN(qs.n - 1);
      if (t.closest('#qplus'))  return setN(qs.n + 1);

      // difficulty chooser
      const diffBtn = t.closest('[data-d]');
      if (diffBtn) {
        qs.diff = +diffBtn.dataset.d;
        diffBtn.parentNode.querySelectorAll('.qch').forEach(x => x.setAttribute('aria-pressed', x === diffBtn));
        qset.diff = qs.diff;
        store.set('ce-qset', JSON.stringify(qset));
        return;
      }

      // answering a question
      const opt = t.closest('.qopt');
      if (!opt || qs.ans[qs.k] !== undefined) return;

      const q = qs.list[qs.k];
      const k = +opt.dataset.k;
      qs.ans[qs.k] = k;

      $$('#app .qopt').forEach((o, j) => {
        o.disabled = true;
        if (j === q.c) o.classList.add('right');
      });
      if (k !== q.c) opt.classList.add('wrong');

      // award XP once per question (3 / 5 / 8 by difficulty)
      let gain = '';
      if (k === q.c && !qxp.has(q.q)) {
        const pts = [3, 5, 8][q.d];
        qxp.add(q.q);
        store.set('ce-qxp', JSON.stringify([...qxp]));
        addXp(pts);
        qs.xp += pts;
        toast('+' + pts + ' XP', 'bolt');
        popXp();
        gain = ' +' + pts + ' XP.';
      }

      $('#qfb').textContent = (k === q.c ? '✓ Correct!' + gain + ' ' : '✗ Not quite. ') + q.x;
      $('#qnx').hidden = false;
    });

    // question-count slider
    $('#app').addEventListener('input', e => {
      if (e.target.id === 'qrange') setN(+e.target.value);
    });

    /* ==========================================================
       14. XP, STREAK & TOAST
       ========================================================== */
    const LV = ['Trailhead', 'Base Camp', 'Camp I', 'Camp II', 'Camp III', 'Summit Ridge', 'Summit'];

    // date key like "2026-10-23", offset = days ago
    const dkey = (offset = 0) => {
      const d = new Date();
      d.setDate(d.getDate() - offset);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    };

    const loadDays = () => {
      try { return new Set(JSON.parse(store.get('ce-days')) || []); }
      catch (e) { return new Set(); }
    };

    // mark today as an active day (keeps the last 60)
    function touchDay() {
      const days = loadDays();
      if (days.has(dkey())) return;
      days.add(dkey());
      store.set('ce-days', JSON.stringify([...days].sort().slice(-60)));
    }

    // consecutive active days ending today (or yesterday)
    function streakNow() {
      const days = loadDays();
      let offset = days.has(dkey()) ? 0 : 1;
      let n = 0;
      while (days.has(dkey(offset))) { n++; offset++; }
      return n;
    }

    function xpNow() {
      const v = store.get('ce-xp');
      if (v === null || v === '' || isNaN(+v)) {
        const x = state.done.size * 40 + ch.size * 20; // first run: derive from progress
        store.set('ce-xp', String(x));
        return x;
      }
      return +v;
    }

    const addXp = n => store.set('ce-xp', String(xpNow() + n));

    function renderStats() {
      const xp = xpNow();
      const level = Math.floor(xp / 200) + 1;
      const streak = streakNow();
      const xpBadge = $('#xpB');
      const streakBadge = $('#stB');

      if (xpBadge) {
        xpBadge.innerHTML = `<span class="icon" style="font-size:14px">bolt</span>${xp} XP`;
        xpBadge.title = `Level ${level} · ${LV[Math.min(level - 1, LV.length - 1)]} · ${xp % 200}/200 XP to the next level`;
      }
      if (streakBadge) {
        streakBadge.innerHTML = `<span class="icon" style="font-size:14px;color:${streak ? '#f59e0b' : 'inherit'}">local_fire_department</span>${streak} day${streak === 1 ? '' : 's'}`;
        streakBadge.title = 'Days in a row';
      }
    }

    // refresh sidebar + play a little pop on the XP badge
    function popXp() {
      renderSide();
      const badge = $('#xpB');
      if (badge) {
        badge.classList.remove('xpop');
        void badge.offsetWidth; // restart animation
        badge.classList.add('xpop');
      }
    }

    let toastTimer = 0;
    function toast(message, icon) {
      let el = $('#toast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'toast';
        el.className = 'toast';
        document.body.appendChild(el);
      }
      el.innerHTML = `<span class="icon" style="color:rgb(var(--c-brand))">${icon || 'check_circle'}</span>${message}`;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    /* ==========================================================
       15. SIDEBAR
       ========================================================== */
    const go = i => { location.href = dash(i); };
    const UI = ['rocket_launch', 'alt_route', 'function', 'data_object', 'deployed_code', 'description', 'landscape'];
    let query = '';

    // does a lesson match the search text?
    const hit = (l, q) => (l.t + ' ' + l.d + ' ' + l.q + ' ' + l.x).toLowerCase().includes(q);

    function renderSide() {
      store.set('ce-last', state.cur);
      renderStats();

      const q = query.trim().toLowerCase();

      $('#units').innerHTML = UNITS.map((u, ui) => {
        const idx  = L.map((l, i) => l.u === ui ? i : -1).filter(i => i >= 0);  // lessons in this unit
        const dn   = idx.filter(i => state.done.has(i)).length;                 // completed count
        const show = q ? idx.filter(i => hit(L[i], q)) : idx;                   // after search filter

        if (!show.length) return '';

        const open = (q || idx.includes(state.cur)) ? 'open' : '';
        const icon = dn === idx.length ? 'task_alt' : 'folder_open';

        const lessons = show.map(i => {
          const isDone = state.done.has(i);
          const isCur  = i === state.cur;
          const ic = isDone ? 'check_circle' : isCur ? 'play_circle' : 'radio_button_unchecked';
          return `<button class="les ${isCur ? 'cur' : ''} ${isDone ? 'done' : ''}" data-i="${i}"><span class="icon">${ic}</span>${L[i].t}</button>`;
        }).join('');

        return `<details class="unit" ${open}>
          <summary>
            <span class="icon">${icon}</span>${u[0]}
            <span class="cnt">${dn}/${idx.length}</span>
            <span class="icon chev">expand_more</span>
          </summary>
          ${lessons}
        </details>`;
      }).join('') || '<p class="muted nores">No lessons match your search.</p>';

      // overall progress
      const n = state.done.size;
      $('#bar').style.width = n / L.length * 100 + '%';
      $('#barL').textContent = n + ' / ' + L.length + ' lessons · ' + xpNow() + ' XP';
      $('#barR').textContent = Math.round(n / L.length * 100) + '%';

      // prev / resume / next buttons
      $('#prev').disabled = state.cur === 0;
      const open = nextOpen();
      $('#resume').innerHTML = open < 0
        ? '<span class="icon">emoji_events</span>View certificate'
        : `<span class="icon">play_arrow</span>Continue · Lesson ${open + 1}`;
      $('#next').innerHTML = state.cur === L.length - 1
        ? 'Finish<span class="icon">flag</span>'
        : 'Next<span class="icon">arrow_forward</span>';
    }

    $('#q').addEventListener('input', e => { query = e.target.value; renderSide(); });

    $('#units').addEventListener('click', e => {
      const btn = e.target.closest('.les');
      if (btn) {
        go(+btn.dataset.i);
        if (innerWidth <= 900) setSide(false);
      }
    });

    $('#prev').onclick = () => go(state.cur - 1);
    $('#next').onclick = () => go(Math.min(state.cur + 1, L.length - 1));

    // open / close the sidebar (remembered between visits)
    const body = $('#body');
    function setSide(open) {
      body.classList.toggle('side-closed', !open);
      $('#sideBtn .icon').textContent = open ? 'left_panel_close' : 'left_panel_open';
      store.set('ce-side', open ? '1' : '0');
    }
    $('#sideBtn').onclick = () => setSide(body.classList.contains('side-closed'));
    setSide(store.get('ce-side') !== '0' && innerWidth > 900);

    $('#resume').onclick = () => {
      const o = nextOpen();
      go(o < 0 ? 0 : o);
    };

    // "Reset progress" needs two clicks within 3 seconds
    let resetTimer = 0;
    $('#rstAll').onclick = e => {
      const btn = e.currentTarget;

      if (!btn.dataset.arm) {
        btn.dataset.arm = 1;
        btn.lastChild.textContent = 'Click again to confirm';
        clearTimeout(resetTimer);
        resetTimer = setTimeout(() => {
          delete btn.dataset.arm;
          btn.lastChild.textContent = 'Reset progress';
        }, 3000);
        return;
      }

      store.set('ce-done', '[]');
      store.set('ce-ch', '[]');
      store.set('ce-grades', '{}');
      store.set('ce-cert', '');
      store.set('ce-last', '0');
      store.set('ce-xp', '0');
      store.set('ce-qxp', '[]');
      location.href = dash(0);
    };

    /* ==========================================================
       16. INIT
       ========================================================== */
    {
      // lesson comes from ?lesson=N, or the last visited lesson
      const param = new URLSearchParams(location.search).get('lesson');
      const last  = store.get('ce-last');

      qs.i = Math.max(0, Math.min(18, param !== null && param !== '' && !isNaN(+param) ? +param : (+last || 0)));
      state.cur = qs.i;

      document.title = 'Quiz · ' + L[qs.i].t + ' · CodeEverest';
      $('#qUnit').textContent = UNITS[L[qs.i].u][0].split(' · ')[0];

      touchDay();
      renderSide();
      qSetup();
    }
  </script>
</body>
